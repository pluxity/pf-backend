spring:
  application:
    name: safers-collect

logging:
  level:
    com: DEBUG

safety-collector:
  site:
    id: ${SAFERS_SITE_ID}                           # 사이트별 다름 — 환경변수 필수
  central:
    ingest-url: ${CENTRAL_INGEST_URL}
    api-key: ${INGEST_API_KEY}
  queue:
    normal-capacity: ${QUEUE_NORMAL_CAPACITY:10000}
    drop-policy: ${QUEUE_DROP_POLICY:DROP_OLDEST}
  forwarder:
    batch-size: ${FORWARDER_BATCH_SIZE:100}
    flush-interval-ms: ${FORWARDER_FLUSH_INTERVAL_MS:1000}
  mqtt:
    host: ${MQTT_HOST:}                             # 미설정 시 MQTT 구독 비활성 — REST API + Springwolf 문서만 동작
    port: ${MQTT_PORT:1883}
    client-id: ${MQTT_CLIENT_ID:safers-collect}
    topic-prefix: ${MQTT_TOPIC_PREFIX:safers/collect}
