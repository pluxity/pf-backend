spring:
  application:
    name: safers-collect

logging:
  level:
    com: DEBUG

safety-collector:
  site:
    id: 42                                         # 이 모듈이 어느 사이트인지 — 중앙 sites.id
  central:
    ingest-url: ${CENTRAL_INGEST_URL:http://localhost:8080}
    api-key: ${INGEST_API_KEY:pluxity}
  queue:
    normal-capacity: 10000                          # in-memory bounded queue capacity
    drop-policy: DROP_OLDEST                        # 큐 가득 시 가장 오래된 envelope drop
  forwarder:
    batch-size: 100                                 # 한 번에 forward 할 envelope 수
    flush-interval-ms: 1000                         # @Scheduled fixedDelay (ms)
  mqtt:
    host: ${MQTT_HOST:localhost}                    # MQTT 브로커 호스트
    port: ${MQTT_PORT:1883}                         # MQTT 브로커 포트 (평문)
    client-id: ${MQTT_CLIENT_ID:safers-collect}     # broker 측 식별자
    topic-prefix: safers/collect                    # 5개 토픽의 공통 prefix
