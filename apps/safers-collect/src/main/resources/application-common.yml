server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  forward-headers-strategy: framework
spring:
  jackson:
    mapper:
      accept-case-insensitive-enums: true

  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB

management:
  server:
    port: ${MANAGEMENT_PORT:9091}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health, metrics
  endpoint:
    health:
      show-details: always            # loopback only 라 안전

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  show-actuator: false
  packages-to-scan: com.pluxity
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

springwolf:
  enabled: true
  docket:
    default-content-type: application/json
    base-package: com.pluxity.safersCollect.v1.collect.mqtt
    info:
      title: Safers Collect MQTT Ingress
      version: 1.0.0
      description: |
        센서 및 디바이스가 MQTT 브로커에 발행해야 하는 메시지 contract.

        ## 브로커 접속 (publisher 측)
        - host/port: 운영 환경 별도 안내 (현장 동일 내부망)
        - 인증: username = device 식별자(예: BAND-A1B2C3), password = 디바이스 발급 키
        - TLS: 현재 미사용 (평문 1883)
        - QoS: 1 (At-Least-Once)
        - retain: false
    servers:
      mqtt:
        protocol: mqtt
        host: ${MQTT_HOST:localhost}:${MQTT_PORT:1883}
